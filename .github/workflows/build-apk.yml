name: Build OmniHub APK

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true

      - name: Rust toolchain (flutter_qjs 引擎)
        run: rustup show

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --split-per-abi

      - name: Rename artifacts
        run: |
          APP_VERSION=$(grep "version:" pubspec.yaml | cut -d':' -f2 | tr -d ' ')
          mkdir -p result
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            [ -f "$f" ] || continue
            abi=$(basename "$f" | sed 's/app-//; s/-release.apk//')
            cp "$f" "result/OmniHub-$APP_VERSION-$abi.apk"
          done
          ls -la result/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnihub-apk
          path: result/
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: result/*.apk
